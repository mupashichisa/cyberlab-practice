<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLab Practice Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CyberLab Practice Portal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main>
    <h2>Welcome, Student</h2>
    <p>This is an intentionally vulnerable site for ethical learning only. Practice finding and fixing issues here.</p>

    <section class="search-box">
      <h3>Search the lab</h3>
      
      <form method="GET" action="index.html">
        <input type="text" name="q" id="searchInput" placeholder="Search..." autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <div id="searchResult" style="margin-top: 15px; padding: 12px; background: #334155; border-radius: 6px;">
        <!-- Search result will appear here -->
      </div>
    </section>
  </main>

  <script>
    // ========== INTENTIONALLY VULNERABLE CODE ==========
    // This code takes user input from the URL and inserts it directly into the page
    // without any cleaning or encoding. This creates a Reflected XSS vulnerability.

    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');

    if (query) {
      // DANGEROUS: Directly inserting user input into HTML
      document.getElementById('searchResult').innerHTML = 
        "<p>You searched for: <strong>" + query + "</strong></p>";
    } else {
      document.getElementById('searchResult').innerHTML = 
        "<p style='color:#94a3b8;'>No search term entered yet.</p>";
    }
  </script>
</body>
</html>
